# Cache lifetime by file type. Done with maps rather than `if` blocks, because
# an add_header inside an `if` discards every add_header from the enclosing
# location (which previously stripped the security headers from media files).
map $uri $arcus_expires {
  default                                                              off;
  # Configuration JSON files are never cached
  ~*\.json$                                                            -1;
  # Media and font files
  ~*\.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$  1M;
  ~*\.(?:ttf|ttc|otf|eot|woff|woff2)$                                  1M;
  # JS/CSS - this will be cache busted for new versions
  ~*\.(?:css|js)$                                                      1y;
}

# Static assets are not access logged
map $uri $arcus_loggable {
  default                                                                                     1;
  ~*\.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|ttf|ttc|otf|eot|woff|woff2|css|js)$  0;
}

server {
  listen 8096;
  listen [::]:8096 ipv6only=on;

  server_tokens off;
  access_log /var/log/nginx/access.log main if=$arcus_loggable;

  add_header 'X-Frame-Options' 'SAMEORIGIN' always;
  add_header 'X-Content-Type-Options' 'nosniff' always;
  add_header 'Referrer-Policy' 'same-origin' always;
  add_header 'Strict-Transport-Security' 'max-age=31536000' always;
  add_header 'Content-Security-Policy' "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
  add_header 'Permissions-Policy' 'camera=(), microphone=(), geolocation=(), payment=(), usb=()' always;

  location / {
    expires $arcus_expires;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    try_files $uri $uri.html /index.html;
  }
}
