name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    # testee waits forever if the browser exits, so stop a hung run well before GitHub's 6 hours
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run test:unit

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Builds the production bundle with the Node in .nvmrc, then the ui-server and static-server images
      - run: ./gradlew :tools:khakis:distDocker
